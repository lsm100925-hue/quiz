<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>퀴즈</title>
    <link rel="stylesheet" href="style.css" />

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  </head>
  <body>
    <div id="header">
      <div id="content">
        <div id="setup-area">
          <h2>문제를 선택하세요</h2>
          <button class="btn" onclick="location.href = 'index.html'">
            메인 화면
          </button>
          <button class="btn btn-category" onclick="selectCategory('무신')">
            무신 정권
          </button>
          <button class="btn btn-category" onclick="selectCategory('무신심화')">
            💀무신 어려움
          </button>
          <button class="btn btn-category" onclick="selectCategory('사회')">
            사회 변화
          </button>
          <button class="btn btn-category" onclick="selectCategory('사회심화')">
            💀사회 어려움
          </button>
          <button class="btn btn-category" onclick="selectCategory('일제')">
            일제 침략
          </button>
        </div>

        <div id="quiz-area" class="hidden">
          <button class="smallBtn" onclick="pass()" id="input">
            정답 티켓 사용
          </button>

          <div style="text-align: center; margin: 15px 0">
            <img
              id="question-image"
              src=""
              alt="문제 이미지"
              class="hidden"
              style="
                max-width: 100%;
                max-height: 250px;
                border-radius: 8px;
                border: 1px solid #ccc;
              "
            />
          </div>

          <h3 id="question-text">질문 준비 중...</h3>
          <input
            type="text"
            id="user-answer"
            placeholder="답을 적고 엔터를 누르세요"
            onkeypress="if (event.keyCode == 13) submitAnswer();"
          />
          <button class="btn" onclick="submitAnswer()">정답 확인</button>
          <div id="feedback"></div>
        </div>

        <div id="result-area" class="hidden">
          <h2>퀴즈 종료!</h2>
          <p id="final-score" style="font-size: 1.2em"></p>
          <button class="btn" onclick="location.reload()">
            처음으로 돌아가기
          </button>
        </div>
      </div>
    </div>

    <script>
      // 2. 🔥 본인의 Firebase 설정 값으로 교체하세요!
      const firebaseConfig = {
        apiKey: "AIzaSyDCrK6BUBzsdZz-mB49mO8vbRgm_fyuPtw",
        authDomain: "historyquiz-6f9b8.firebaseapp.com",
        projectId: "historyquiz-6f9b8",
        storageBucket: "historyquiz-6f9b8.firebasestorage.app",
        messagingSenderId: "716549733296",
        appId: "1:716549733296:web:87ed0000657fcc68047475",
        measurementId: "G-2BZ4V1NDHV",
      };

      // Firebase 및 Firestore 초기화
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      const key = "historyQuiz3";
      const savedData = localStorage.getItem(key);
      let userData;

      // 고유 ID 생성을 위한 함수
      function generateUUID() {
        return (
          "user_" +
          Math.random().toString(36).substr(2, 9) +
          Date.now().toString(36)
        );
      }

      if (savedData === null) {
        const setting = {
          uid: generateUUID(), // 고유 식별 ID 추가
          coin: 0,
          lv: 1,
          point: 0,
          name: "이름 없음",
          inv: ["역사왕초보"],
          equip: ["역사왕초보"],
          clear: [true, true, true, true, true, true, true, true, true],
        };
        localStorage.setItem(key, JSON.stringify(setting));
        userData = setting;
      } else {
        userData = JSON.parse(savedData);
        // 만약 기존 데이터에 uid가 없다면 자동 부여
        if (!userData.uid) {
          userData.uid = generateUUID();
          localStorage.setItem(key, JSON.stringify(userData));
        }
      }

      const quizDb = {
        무신: [
          { q: "고려 초의 집권세력?", a: "문벌" },
          { q: "인종의 장인이자 외할아버지, 대표적 문벌이다.", a: "이자겸" },
          { q: "묘청은 0종 승려이다. (한글자로 답변)", a: "선" },
          { q: "문벌은 풍수지리를 믿었다. (예/아니)", a: "아니" },
          { q: "묘청은 00나라를 새워 봉기하였다.", a: "대위" },
          { q: "이의방, 000가 무신정변을 일으켰다.", a: "정중부" },
          { q: "최충헌이 정책 결정을 위해 설치.", a: "교정도감" },
          { q: "최충헌이 사병을 위해 확대.", a: "도방" },
          { q: "최우 아버지 이름은?.", a: "최충헌" },
          { q: "최우가 설치한 군사조직은?.", a: "삼별초" },
          { q: "최우가 인사권 장악을 위해 설치한 것은?.", a: "정방" },
          { q: "망이 망소이의 난, xx의 난은 무신 정권 시기때이다", a: "만적" },
          { q: "무신 정권때 xx이 침입함", a: "몽골" },
        ],
        무신심화: [
          {
            q: "위 자료를 보고 보라색으로 칠해진 지역을 공격한 왕을 고르시오",
            a: "공민왕",
            png: "공민왕.png",
          },
          {
            q: "이 가상 대화의 반란 주동자는 누구인가?",
            a: "만적",
            alt: "만적의 난",
            png: "만적.png",
          },
          {
            q: "상률가의 가상 대화이다. 집권자는 누구인가?",
            a: "권문세족",
            png: "상률가.png",
          },
          {
            q: "이것은 누구의 난인가?",
            a: "묘청",
            alt: "묘청의 난",
            png: "서경.png",
          },
          {
            q: "이 사건의 결과로 xx 집권자들은 혼란을 겪었다.",
            a: "문벌",
            alt: "문신",
            png: "인종.png",
          },
          {
            q: "이 사건의 결과로 생긴 집권자들의 ~가 최고 기구가 되었다.",
            a: "중방",
            png: "오병.png",
          },
        ],

        사회심화: [
          {
            q: "이 당시 고려는 신라에 비해 xx을 강조했다.",
            a: "능력",
            png: "능력고려.png",
          },
          {
            q: "이 법을 시행하기 전에는 xx들이 감소하는 중이였다.",
            a: "농민",
            alt: "평민",
            png: "진대.png",
          },
          {
            q: "이 지방의 양인들은 xx이라고 불린다.",
            a: "사림",
            png: "서원.png",
          },
          {
            q: "이때는 남성의 지위가 높았다 (예 / 아니)",
            a: "아니",
            png: "부곡.png",
          },
          {
            q: "향부곡민 같이 천역을 맞았던 조선 양인은?",
            a: "신량역천",
          },
          {
            q: "천민은 모두 노비이다.",
            a: "아니",
          },
        ],
        사회: [
          { q: "최초로 신분제가 시행되는 시기는?", a: "청동기" },
          { q: "고대의 신분은 (능력 / 혈통) 중심이다", a: "혈통" },
          {
            q: "고구려 태조왕이 시행한 xx법은 국가 재정을 보충했다 (~법)",
            a: "진대",
          },
          { q: "신라의 신분 체제는?", a: "골품제" },
          { q: "고려의 신분 제도는?", a: "양천제" },
          { q: "조세.공물.역의 책임을 지지 않은 낮은 고려 계급은?", a: "천민" },
          { q: "고려 양인 중 농민을 부르는 다른 말은?", a: "백정" },
          { q: "신라 vs 고려, 능력 중심 사회는?", a: "고려" },
          { q: "고려는 일부다처제이다. (예 / 아니)", a: "아니" },
          { q: "신랑이 신부집에서 살았다 (예 / 아니)", a: "아니" },
          {
            q: "고려에서 남여 구분없이 자산을 상속한 제도 이름은?",
            a: "균분 상속",
          },
          { q: "신량역천은 하급 관리였다 (예 / 아니)", a: "아니" },
        ],
        일제: [
          { q: "청.일 전쟁의 승리자는? (한글자)", a: "일" },
          { q: "러.일 전쟁의 승리자는? (한글자))", a: "일" },
          { q: "러.일 전쟁 때 일본이 싸운 함대 (2글자)", a: "발트" },
          {
            q: "일본은 러시와와 xxxx 조약을 맺어 한국 지배를 인정 받았다.",
            a: "포츠머스",
          },
          { q: "고종은 xxx xx를 보낸 이유로 퇴위되었다.", a: "헤이그 특사" },
          { q: "고종이 러시아 공사관으로 도망간 사건은?", a: "아관파천" },
          {
            q: "고종은 아관파천으로 러시아 영토로 도망갔다. (예 / 아니)",
            a: "아니",
          },
          {
            q: "을사는약의 무효성을 알리서 미국에 파견된 사람 이름은?",
            a: "헐버트",
          },
          { q: "조선 최초의 근대 조약은?", a: "강화도 조약" },
          { q: "을미의병은 관군에게 진압되었다. (예 / 아니)", a: "아니" },
          { q: "을미의병이 일어난 이유? 3글자", a: "단발령" },
          { q: "의병이 2번째로 활발했던 시기는? 4글자", a: "정미의병" },
          {
            q: "평민 의병장 이인영은 13도 창의군의 총대장이다. (예 / 아니)",
            a: "아니",
          },
          {
            q: "일본의 남한 대토벌 작전으로 의병은 극단적으로 줄었다. (예 / 아니)",
            a: "예",
          },
          { q: "이토 히로부미를 저격한 사람은?", a: "안중근" },
        ],
      };
      let currentQuestions = [];
      let currentIndex = 0;
      let score = 0;
      let name = "";

      let showA = find("돋보기");
      if (showA !== null) {
        const count = userData.equip[showA] ?? 0;

        document.getElementById("input").innerText = "정답 티켓 사용: " + count;

      }
      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function selectCategory(type) {
        currentQuestions = shuffleArray([...quizDb[type]]);
        currentIndex = 0;
        score = 0;
        name = type;

        document.getElementById("setup-area").classList.add("hidden");
        document.getElementById("quiz-area").classList.remove("hidden");
        showQuestion();
      }

      function showQuestion() {
        if (currentIndex < currentQuestions.length) {
          const currentQuiz = currentQuestions[currentIndex];

          document.getElementById("question-text").innerText = currentQuiz.q;

          const imgElement = document.getElementById("question-image");
          if (currentQuiz.png) {
            imgElement.src = currentQuiz.png;
            imgElement.classList.remove("hidden");
          } else {
            imgElement.src = "";
            imgElement.classList.add("hidden");
          }

          document.getElementById("user-answer").value = "";
          document.getElementById("feedback").innerText = "";
          document.getElementById("user-answer").focus();
        } else {
          showFinalResult();
        }
      }
      function submitAnswer() {
        const userVal = document.getElementById("user-answer").value.trim();
        const currentQuiz = currentQuestions[currentIndex];
        const correctVal = currentQuiz.a;
        const altVal = currentQuiz.alt;
        const feedback = document.getElementById("feedback");

        if (userVal === correctVal || (altVal && userVal === altVal)) {
          score++;
          feedback.innerHTML = "<span style='color:blue'>⭕ 정답!</span>";
        } else {
          const showAnswer = altVal
            ? `${correctVal} 또는 ${altVal}`
            : correctVal;
          feedback.innerHTML = `<span style='color:red'>❌ 오답 (정답: ${showAnswer})</span>`;
        }

        setTimeout(() => {
          currentIndex++;
          showQuestion();
        }, 800);
      }

      function showFinalResult() {
        document.getElementById("quiz-area").classList.add("hidden");
        document.getElementById("result-area").classList.remove("hidden");
        let msg = "";

        userData.point += score;
        userData.coin += score * 2;
        let totalPoint = userData.point || 0;
        if (find("포인트2") != null) {
          if (userData.equip[find("포인트2")] > 0) {
            userData.equip[find("포인트2")]--;
            userData.point += score;
            totalPoint += score;
          }
        }
        if (find("포인트버프") != null) {
          userData.point += Math.floor(score * 0.2);
          totalPoint += Math.floor(score * 0.2);
        }
        if (find("코인2배") != null) {
          userData.coin += score * 2;
        }

        document.getElementById("final-score").innerHTML =
          `총 <strong>${currentQuestions.length}</strong>개 중 <strong>${score}</strong>개를 맞혔습니다!<br>` +
          `현재 총 포인트: <strong>${totalPoint}</strong>점`;

        save();

        updateServerRanking();
      }

      function save() {
        localStorage.setItem(key, JSON.stringify(userData));
      }

function updateServerRanking() {
        if (userData.name === "이름 없음") return;

        const userRef = db.collection("rankings").doc(userData.uid);

        userRef.get().then((doc) => {
          let updateData = {};
          let shouldUpdate = false;

          if (doc.exists) {
            const serverData = doc.data();
            const serverPoint = serverData.point || 0;
            const serverCoin = serverData.coin || 0;

            // 포인트 갱신 체크
            if (userData.point > serverPoint) {
              updateData.point = userData.point;
              shouldUpdate = true;
            }
            // 코인 갱신 체크
            if (userData.coin > serverCoin) {
              updateData.coin = userData.coin;
              shouldUpdate = true;
            }
          } else {
            // 처음 등록하는 경우
            updateData = {
              uid: userData.uid,
              name: userData.name,
              point: userData.point,
              coin: userData.coin,
            };
            shouldUpdate = true;
          }

          // 갱신할 데이터가 있다면 서버에 저장 (merge: true를 사용해 기존 데이터 유지)
          if (shouldUpdate) {
            updateData.timestamp = firebase.firestore.FieldValue.serverTimestamp();
            userRef.set(updateData, { merge: true })
              .then(() => {
                console.log("랭킹이 업데이트되었습니다.");
              })
              .catch((error) => console.error("서버 랭킹 갱신 오류:", error));
          }
        });
      }
      function find(name) {
        for (let i = 0; i < userData.inv.length; i++) {
          const element = userData.inv[i];

          if (element == name) {
            return i; 
          }
        }
        return null; 
      }

      function pass() {
        let itemIndex = find("돋보기");

        if (itemIndex !== null && userData.equip[itemIndex] >= 1) {
          userData.equip[itemIndex]--;

          document.getElementById("user-answer").value =
            currentQuestions[currentIndex].a;
          alert("사용 완료");
          save();

          const count = userData.equip[showA] ?? 0;

          document.getElementById("input").innerText =
            "정답 티켓 사용: " + count;
        } else {
          save();
          alert("정답 티켓이 부족합니다");
        }
      }
    </script>
  </body>
</html>
