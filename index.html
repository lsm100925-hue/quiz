<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <title>승민의 역사 학습 사이트</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <div id="game-container">
  <div id="header">
    <h1>역사 학습 사이트</h1>
    <h2 id="nickname">안녕하세요</h2>
    <p>1학년 9반 역사 학습 사이트입니다.</p>
    
    <div class="box" style="margin: 20px 0; padding: 15px; background: #787878; border-radius: 10px; font-size: 1em;">
      <div style="display: flex; justify-content: space-around; font-weight: bold; margin-bottom: 8px;">
        <span>✨ 내 포인트: <span id="display-point" style="color: #228be6;">0</span> 점</span>
        <span>🪙 내 코인: <span id="display-coin" style="color: #fcc419;">0</span> 개</span>
      </div> 
      <div style="font-size: 0.85em; color: #000000; text-align: center; margin-top: 5px; border-top: 1px solid #e9ecef; padding-top: 5px;">
        원하는 메뉴를 선택하여 학습을 시작하세요!
      </div>
    </div>

    <div id="menu-area">
      <button class="btn" onclick="location.href='index.html'">메인 화면</button>
      <button class="btn btn-category" onclick="goToQuiz(1)"> 역사 퀴즈 풀기</button>
      <button class="btn" onclick="location.href='store.html'">상점(실험 기능)</button>
      <button class="btn" style="background-color: #40c057; color: white;" onclick="updateServerRanking()">🏆 랭킹 등록하기</button>
    </div>
<div id="ranking-area" class="hidden" style="color: #000000;">
      <h2 style="color: #000000;">서버 랭킹</h2>
      
      <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;">
        <button class="btn" onclick="listenRanking('coin')">◀ 코인 랭킹</button>
        <button class="btn" onclick="listenRanking('point')">포인트 랭킹 ▶</button>
      </div>

      <h3 id="ranking-title" style="color: #000000;">⭐ 포인트 랭킹</h3>
      
      <table style="width: 100%; text-align: left; background: #f9f9f9; border-radius: 8px; border-collapse: collapse; margin-bottom: 15px; color: #000000;">
        <tbody id="ranking-list">
        </tbody>
      </table>
    </div>

    <div id="setting">
      <br><br><br>
      <input class="btn" type="text" placeholder="변경할 이름" id="name">
      <button class="btn btn-category" onclick="changeName()">이름 변경 하기</button>
    </div>

    <div id="footer" style="margin-top: 20px; color: #000000; font-size: 0.8em;">
      마음대로 공유하지 마세요😢
    </div>
  </div>
</div>
  <script>
    // 🔥 본인의 Firebase 설정 값으로 교체하세요!
  const firebaseConfig = {
    apiKey: "AIzaSyDCrK6BUBzsdZz-mB49mO8vbRgm_fyuPtw",
    authDomain: "historyquiz-6f9b8.firebaseapp.com",
    projectId: "historyquiz-6f9b8",
    storageBucket: "historyquiz-6f9b8.firebasestorage.app",
    messagingSenderId: "716549733296",
    appId: "1:716549733296:web:87ed0000657fcc68047475",
    measurementId: "G-2BZ4V1NDHV"
  };
    
    // Firebase 및 Firestore 초기화
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let userData;
    const key = 'historyQuiz3';

    // 고유 ID 생성을 위한 간단한 함수 (UUID)
    function generateUUID() {
      return 'user_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
    }

    // 페이지 로드 시 로컬 스토리지 데이터 반영 및 랭킹 불러오기
    window.onload = function() {
      const savedData = localStorage.getItem(key);
      
      if (savedData === null) {
        const setting = {
          uid: generateUUID(), 
          coin: 0,
          point: 0,
          lv: 1,
          name: "이름 없음",
          inv: ["역사왕초보"],
          equip: ["역사왕초보"],
          clear: [true, true, true, true, true, true, true, true, true]
        };
        localStorage.setItem(key, JSON.stringify(setting));
        userData = setting;
      } else {
        userData = JSON.parse(savedData);
        // 만약 기존 데이터에 uid가 없다면 새로 생성해서 넣어줌 (하위 호환성)
        if (!userData.uid) {
          userData.uid = generateUUID();
          localStorage.setItem(key, JSON.stringify(userData));
        }
      }

      
      document.getElementById('nickname').innerText = userData.name;
      document.getElementById("display-coin").innerText = userData.coin;
      document.getElementById("display-point").innerText = userData.point;

      // 실시간 랭킹 감시 시작
      listenRanking();
    };
      
    function goToQuiz(value) {
      location.href = "historyquiz.html";
    }

    // ✨ 이름을 변경할 때 고유 ID를 사용하여 Firestore를 업데이트하는 기능
    function changeName(){
      const newName = document.getElementById("name").value.trim();
      if(newName === "") {
        alert("이름을 입력해주세요!");
        return;
      }

      // 1. 로컬 데이터 변경 및 저장
      userData.name = newName;
      document.getElementById('nickname').innerText = userData.name;
      localStorage.setItem(key, JSON.stringify(userData));
      document.getElementById("name").value = "";

      // 2. Firestore에 기존 등록된 내 고유 ID 문서가 있는지 확인 후 연동 수정
      const userRef = db.collection("rankings").doc(userData.uid);

      userRef.get().then((doc) => {
        if (doc.exists) {
          const serverPoint = doc.data().point || 0;
          
          // 핵심 요건: 내 현재 로컬 점수가 서버에 기록된 최고 점수보다 높을 때만 닉네임과 점수 모두 교체
          if (userData.point > serverPoint) {
            userRef.update({
              name: newName,
              point: userData.point,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            // 내 현재 점수가 서버 점수보다 낮거나 같다면, 점수는 유지하고 이름만 새 이름으로 교체
            userRef.update({
              name: newName
            });
          }
        }
        alert("이름이 변경되었습니다!");
      }).catch((error) => {
        console.error("이름 변경 서버 반영 에러: ", error);
        alert("이름은 변경되었으나 랭킹 반영에 실패했습니다.");
      });
    }

    // ✨ [랭킹 등록하기] 버튼 클릭 시 고유 ID 기준으로 최고 점수 저장하는 함수
   function updateServerRanking() {
        if (userData.name === "이름 없음") return;

        const userRef = db.collection("rankings").doc(userData.uid);

        userRef.get().then((doc) => {
          let updateData = {};
          let shouldUpdate = false;

          if (doc.exists) {
            const serverData = doc.data();
            const serverPoint = serverData.point || 0;
            const serverCoin = serverData.coin || 0;

            // 포인트 갱신 체크
            if (userData.point > serverPoint) {
              updateData.point = userData.point;
              shouldUpdate = true;
            }
            // 코인 갱신 체크
            if (userData.coin > serverCoin) {
              updateData.coin = userData.coin;
              shouldUpdate = true;
            }
          } else {
            // 처음 등록하는 경우
            updateData = {
              uid: userData.uid,
              name: userData.name,
              point: userData.point,
              coin: userData.coin,
            };
            shouldUpdate = true;
          }

          // 갱신할 데이터가 있다면 서버에 저장 (merge: true를 사용해 기존 데이터 유지)
          if (shouldUpdate) {
            updateData.timestamp = firebase.firestore.FieldValue.serverTimestamp();
            userRef.set(updateData, { merge: true })
              .then(() => {
                console.log("랭킹이 업데이트되었습니다.");
              })
              .catch((error) => console.error("서버 랭킹 갱신 오류:", error));
          }
        });
      }

    // Firestore에서 실시간으로 데이터를 읽어와 랭킹 테이블을 채우는 함수
// 💡 실시간 리스너 중복 실행을 막기 위한 변수
      let unsubscribeRanking = null;

      function listenRanking(type = 'point') {
        // 1. 기존 리스너가 있다면 먼저 해제합니다 (버튼 누를 때마다 중복 생성 방지)
        if (unsubscribeRanking) {
          unsubscribeRanking();
        }

        // 2. 랭킹 제목 변경
        const titleElement = document.getElementById("ranking-title");
        if (titleElement) {
          titleElement.innerText = type === 'coin' ? "💰 코인 랭킹" : "⭐ 포인트 랭킹";
        }

        // 3. 새로운 실시간 리스너 등록
        unsubscribeRanking = db.collection("rankings")
          .orderBy(type, "desc")
          .limit(5)
          .onSnapshot((snapshot) => {
            const rankingListBody = document.getElementById("ranking-list");
            rankingListBody.innerHTML = ""; 

            if (snapshot.empty) {
              rankingListBody.innerHTML = `<tr><td colspan="3" style="padding: 10px; color: #868e96; text-align: center;">아직 등록된 랭킹이 없습니다. 1등을 차지해보세요!</td></tr>`;
              return;
            }

            let rank = 1;
            snapshot.forEach((doc) => {
              const data = doc.data();
              
              // 선택된 타입에 따라 점수와 단위(점/코인) 결정
              const score = type === 'coin' ? (data.coin || 0) : (data.point || 0);
              const unit = type === 'coin' ? '코인' : '점';
              
              const row = `
                <tr style="border-bottom: 1px solid #e9ecef; ${data.uid === userData.uid ? 'background-color: #e7f5ff; font-weight: bold;' : ''}">
                  <td style="padding: 8px; color: ${rank === 1 ? '#fcc419' : '#495057'}">${rank}등</td>
                  <td>${data.name} ${data.uid === userData.uid ? '(나)' : ''}</td>
                  <td style="font-weight: bold; color: #228be6;">${score} ${unit}</td>
                </tr>
              `;
              rankingListBody.innerHTML += row;
              rank++;
            });
          }, (error) => {
            console.error("랭킹 로드 에러: ", error);
          });
      }
  </script>

</body>
</html>
